<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование аккаунта {{ account.id }}</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; border-radius: 8px; padding: 20px; max-width: 500px; margin: 0 auto; }
        label { display: block; margin: 10px 0 5px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .message { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
<div class="card">
    <h2>Редактирование аккаунта {{ account.id }}</h2>
    <form id="settings-form">
        <label for="resume_id">ID резюме:</label>
        <input type="text" id="resume_id" value="{{ account.resume_id }}" required>

        <label for="daily_limit">Дневной лимит откликов:</label>
        <input type="number" id="daily_limit" value="{{ state.daily_limit if state else '' }}" required>

        <button type="submit">Сохранить</button>
    </form>
    <div id="message"></div>
    <p><a href="/accounts/{{ account.id }}">← Назад к аккаунту</a></p>
</div>

<script>
    document.getElementById('settings-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const resume_id = document.getElementById('resume_id').value;
        const daily_limit = parseInt(document.getElementById('daily_limit').value);
        const msgDiv = document.getElementById('message');

        try {
            const response = await fetch(`/api/accounts/{{ account.id }}/settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ resume_id, daily_limit })
            });
            const data = await response.json();
            if (response.ok) {
                msgDiv.innerHTML = `<div class="message success">✅ Настройки сохранены</div>`;
            } else {
                msgDiv.innerHTML = `<div class="message error">❌ Ошибка: ${data.detail || 'Неизвестная ошибка'}</div>`;
            }
        } catch (err) {
            msgDiv.innerHTML = `<div class="message error">❌ Ошибка сети: ${err}</div>`;
        }
    });
</script>
</body>
</html>
