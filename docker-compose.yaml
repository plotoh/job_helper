services:
  postgres:
    image: postgres:17-alpine
    container_name: hhparser_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: hhparser
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d hhparser"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: hhparser_worker
    command: python -m app.scheduler.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RESPONSES_ENABLED: "true"
      TZ: Europe/Moscow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hhparser
      DB_USER: user
      DB_PASSWORD: pass
      HH_SEARCH_URL: "https://hh.ru/search/vacancy?text=Python+Developer&area=1"
      MAX_PAGES: 2
      MAX_CONCURRENT: 5
      COOKIES_DIR: /app/cookies
      PARSING_COOKIES_FILE: /app/cookies/parsing.txt
      MESSAGE_TEMPLATE_FILE: /app/message_template.txt
      PLAYWRIGHT_HEADLESS: "true"
      WORK_START_HOUR: 9
      WORK_START_MINUTE: 13
      WORK_END_HOUR: 18
      WORK_END_MINUTE: 41
      PAUSE_COUNT: 3
      PAUSE_MIN_MINUTES: 30
      PAUSE_MAX_MINUTES: 60
      DAILY_LIMIT_MIN: 53
      DAILY_LIMIT_MAX: 97
      LOG_LEVEL: INFO
    volumes:
      - ./cookies:/app/cookies
#      - ./message_template.txt:/app/message_template.txt

  bot:
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 1.0.0.1
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: hhparser_bot
    command: python -m app.bot.bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hhparser
      DB_USER: user
      DB_PASSWORD: pass
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID}
      TELEGRAM_USERS_IDS: ${TELEGRAM_USERS_IDS}
      LOG_LEVEL: INFO
    volumes:
      - ./cookies:/app/cookies

volumes:
  pgdata: